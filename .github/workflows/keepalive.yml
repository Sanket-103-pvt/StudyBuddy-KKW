# Once a day, one tiny read against Supabase so the free-plan project is never idle for a week.
# Needed when the site is on a static host (Cloudflare Pages) that has no cron of its own.
# Add repository secrets: NEXT_PUBLIC_SUPABASE_URL and NEXT_PUBLIC_SUPABASE_ANON_KEY.
name: Supabase keepalive
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Read one row from the public leaderboard view
        env:
          URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$URL" ] || [ -z "$KEY" ]; then echo "secrets not set, skipping"; exit 0; fi
          base="${URL%/}"; base="${base%/rest/v1}"
          curl -fsS -H "apikey: $KEY" "$base/rest/v1/leaderboard?select=display_name&limit=1" > /dev/null
