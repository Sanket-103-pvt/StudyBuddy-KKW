name: E2E Tests & CI Pipeline

on:
  push:
    branches: [ master, "ci-fix/**" ]
  pull_request:
    branches: [ master ]

jobs:
  cypress-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate Content Schema
        run: npm run validate

      - name: Run Unit Tests
        run: npm test

      - name: Build
        run: npm run build

      # The server is started and checked by hand instead of through cypress-io/github-action's
      # start/wait-on options: those failed here with "Socket closed before the connection was established".
      - name: Start server
        run: |
          nohup npm run start -- -H 127.0.0.1 -p 3000 > server.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null http://127.0.0.1:3000/; then echo "Server is up"; exit 0; fi
            sleep 2
          done
          echo "Server did not start"; cat server.log; exit 1

      - name: Cypress E2E Tests
        uses: cypress-io/github-action@v6
        with:
          install: false

      - name: Server log (on failure)
        if: failure()
        run: cat server.log || true
